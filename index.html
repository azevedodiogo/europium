<!-- Declara o documento como HTML moderno para o browser interpretar a página corretamente. -->
<!DOCTYPE html>
<!-- Define o idioma principal da aplicação como português. -->
<html lang="pt">
  <!-- Agrupa metadados, título, favicon e fontes carregadas antes da aplicação. -->
  <head>
    <!-- Garante suporte a acentos e caracteres usados em português. -->
    <meta charset="UTF-8" />
    <!-- Define o favicon apresentado no separador do browser. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Faz a página adaptar-se corretamente a ecrãs móveis. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Título visível no separador do browser. -->
    <title>Europium — Recuperação e Resiliência</title>
    <!-- Antecipação da ligação ao servidor da Google Fonts. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <!-- Antecipação da ligação ao servidor dos ficheiros da fonte, com CORS. -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Carrega a família tipográfica usada pela interface. -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <!-- Corpo da página onde o Vue monta a aplicação. -->
  <body>
    <!-- Elemento raiz controlado pelo Vue. -->
    <div id="app"></div>
    <!-- Script de entrada que arranca a aplicação Vue. -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
